; Pool php-fpm de production — voir /loadtests.
;
; L'image `php:8.3-fpm` de base ne fournit AUCUN de ces réglages : la
; production tournait sur le défaut du paquet, `pm.max_children = 5`, jamais
; choisi ni même écrit nulle part dans ce dépôt. Mesuré sous charge réaliste
; (loadtests/scenarios/school-day.js, mélange pondéré de rôles avec temps de
; réflexion) : 5 workers saturent déjà entre 300 et 1000 utilisateurs
; simultanés (avertissements "server reached pm.max_children" dans les logs,
; p95 passant de ~60 ms à plus de 750 ms). Chaque worker ne consomme qu'environ
; 7 Mo de RSS mesurés dans ce même test — les monter à 20 n'a quasiment aucun
; coût mémoire et a ramené le p95 à ~57 ms sur la même charge.
;
; 20 reste indicatif, dimensionné pour le poste qui a fait tourner le test (14
; cœurs, voir loadtests/README.md) : à revalider si l'hébergement réel a moins
; de cœurs ou moins de RAM disponible.
[www]
pm = dynamic
pm.max_children = 20
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 12
