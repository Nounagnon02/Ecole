server {
    listen 80;
    server_name _;
    root /var/www/public;

    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # php-fpm écoute en TCP sur 9000 dans l'image de production
        # (php:8.3-fpm, voir le Dockerfile), pas sur une socket Unix. L'ancienne
        # cible `unix:/var/run/php/php8.2-fpm.sock` est un chemin de paquet
        # Debian PHP 8.2 installé sur un hôte : elle n'existe pas dans cette
        # image, et nginx répondait 502 à toute requête. `app` est le nom du
        # service php-fpm (loadtests/docker-compose.yml) — à adapter si le
        # conteneur s'appelle autrement.
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }
}